[package]
name = "interactive"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "interactive"
path = "src/main.rs"

[dependencies]
bevy = "0.16"
candle-core = { workspace = true }
candle-nn = { workspace = true }
console_error_panic_hook = "0.1"
# getrandom is pulled in by Bevy (for UUIDs) and Candle (for random number generation)
# but neither enables the wasm_js feature required for WASM compilation.
# We add it here solely to enable that feature - we don't use it directly.
getrandom = { version = "0.3", features = ["wasm_js"] }
shared = { path = "../shared" }
anyhow = { workspace = true }
serde = { workspace = true }
toml = "0.8"
safetensors = "0.4"