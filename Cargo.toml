[workspace]
members = ["training", "interactive", "shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Erik Engelhardt <https://github.com/DenominatorIsZero>"]
license = "MIT"
repository = "https://github.com/DenominatorIsZero/example_project"
homepage = "https://github.com/DenominatorIsZero/example_project"
documentation = "https://github.com/DenominatorIsZero/example_project#readme"
keywords = ["ai", "machine-learning", "bevy", "wasm", "template", "candle"]
categories = ["science", "web-programming", "webassembly", "template-engine", "visualization"]

[workspace.dependencies]
candle-core = "0.9"
candle-nn = "0.9"
anyhow = "1.0.99"
serde = { version = "1.0.207", features = ["derive"] }

# Size-optimized release profile for WASM builds
[profile.release]
opt-level = 'z'        # Optimize for size over performance
strip = "symbols"      # Remove symbol information 
lto = true            # Enable link-time optimization
codegen-units = 1     # Single compilation unit for better optimization
panic = 'abort'       # Reduce panic handling overhead